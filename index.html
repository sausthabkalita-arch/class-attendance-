<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Attendance Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 320px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            color: #555;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
        #status {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Mark Attendance</h2>
    <form id="attendanceForm">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" required placeholder="Enter Name">

        <label for="studentId">Student ID</label>
        <input type="text" id="studentId" required placeholder="Enter Roll / ID">

        <label for="classSelect">Select Class</label>
        <select id="classSelect" required>
            <option value="" disabled selected>-- Choose Class --</option>
            <option value="1st Class">1st Class</option>
            <option value="2nd Class">2nd Class</option>
        </select>

        <button type="submit">Submit Attendance</button>
    </form>
    <div id="status"></div>
</div>

<script>
    // Replace with your actual deployed Web App URL from Apps Script
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwWjYnRuWvdgWEbGxcT5-xEwnVWpGnveAVP-RUbiK2Rs5lo7omz5AYrqlFdmjKQkCzR/exec'; 

    const form = document.getElementById('attendanceForm');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', e => {
        e.preventDefault();
        statusDiv.style.color = 'blue';
        statusDiv.innerText = 'Submitting...';

        const payload = {
            name: document.getElementById('studentName').value,
            id: document.getElementById('studentId').value,
            class: document.getElementById('classSelect').value
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors', // Required for Google Apps Script web apps
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        })
        .then(() => {
            statusDiv.style.color = 'green';
            statusDiv.innerText = 'Attendance recorded successfully!';
            form.reset();
        })
        .catch(error => {
            statusDiv.style.color = 'red';
            statusDiv.innerText = 'Error submitting attendance.';
            console.error('Error:', error);
        });
    });
</script>

</body>
</html>
